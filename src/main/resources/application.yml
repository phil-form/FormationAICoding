# Configuration commune — valeurs sûres par défaut, surchargées par application-dev.yml / application-prod.yml.
spring:
  application:
    name: formation
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:formation}
    username: ${DB_USER:formation}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000   # ms
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      # Refuse les champs inconnus : pas d'affectation silencieuse de propriétés (mass assignment).
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 2MB
    max-http-form-post-size: 2MB
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  security:
    strict: false
    require-https: false
    https-port: 8443
    redirect-host: ""
    hsts:
      enabled: false
      max-age: 730d
      include-sub-domains: true
      preload: false
    # API JSON : rien à charger, rien à encadrer.
    content-security-policy: "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
      allowed-origin-patterns: []
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Authorization,Content-Type,Accept
      exposed-headers: Location
      allow-credentials: false
      max-age: 1h
