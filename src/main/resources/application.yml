# Configuration commune — valeurs sûres par défaut, surchargées par application-dev.yml / application-prod.yml.
spring:
  application:
    name: formation
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:formation}
    # Utilisés uniquement SANS OpenBao (tests, lancement local ad hoc). Avec app.openbao.enabled=true, les
    # identifiants sont dynamiques (OpenBao) et aucun mot de passe DB n'est fourni à l'API.
    username: ${DB_USER:formation}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000   # ms
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      # Refuse les champs inconnus : pas d'affectation silencieuse de propriétés (mass assignment).
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  servlet:
    multipart:
      # Photos (C10) : 10 Mo par fichier, une photo par requête (+ marge pour l'enveloppe multipart). Alignés sur
      # app.storage.max-file-size et sur la limite du WAF (MODSEC_REQ_BODY_LIMIT, docker-compose.test-prod.yml).
      max-file-size: 10MB
      max-request-size: 11MB
      # Gardé en mémoire : un fichier en clair n'est jamais écrit dans /tmp (il sera chiffré par FileStorage).
      file-size-threshold: 11MB

server:
  port: 8080
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 2MB
    max-http-form-post-size: 2MB
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  # Fichiers téléversés, chiffrés au repos (framework/storage). Volume uploads en dev / prod.
  storage:
    root: ${UPLOADS_DIR:/var/lib/formation/uploads}
    max-file-size: 10MB
    max-pixels: 40000000
  # OpenBao (ADR 0001) : désactivé par défaut ; activé par les profils dev et prod.
  openbao:
    enabled: false
    uri: ${OPENBAO_ADDR:http://openbao:8200}
    role-id-file: /run/secrets/openbao/role-id
    secret-id-file: /run/secrets/openbao/secret-id
    ca-file: ""
    database-role: app
    migrator-role: migrator
    schema-owner-role: formation_owner
    lease-expiry-threshold: 10m
  security:
    strict: false
    require-https: false
    https-port: 8443
    redirect-host: ""
    hsts:
      enabled: false
      max-age: 730d
      include-sub-domains: true
      preload: false
    # API JSON : rien à charger, rien à encadrer.
    content-security-policy: "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
      allowed-origin-patterns: []
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Authorization,Content-Type,Accept
      exposed-headers: Location
      allow-credentials: false
      max-age: 1h
