# Production : strict. Le démarrage échoue si la configuration de sécurité n'est pas conforme
# (voir SecurityProperties#assertStrict).
#
# Architecture : client ──HTTPS──▶ HAProxy (443, certificat Let's Encrypt) ──TLS 1.3 re-chiffré──▶ API (8443)
#   - HAProxy : exposition publique, redirection 80 → 443, challenge ACME (certbot), limitation de débit ;
#   - API : TLS 1.3 uniquement, suites AEAD, HTTP/2, certificat PEM monté en lecture seule et rechargé à chaud
#     après chaque renouvellement certbot (deploy hook) ;
#   - IP client / schéma lus depuis X-Forwarded-For / X-Forwarded-Proto, uniquement si la connexion vient d'un
#     proxy de confiance (TRUSTED_PROXIES).
# Sans HAProxy (test local) : l'API reste accessible en direct sur https://localhost:8443.
server:
  port: ${SERVER_PORT:8443}
  http2:
    enabled: true
  ssl:
    enabled: ${TLS_ENABLED:true}
    bundle: api
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Regex (Tomcat RemoteIpValve) des IP de proxy de confiance, obligatoire : seules ces connexions peuvent
      # fixer l'IP client et le schéma. Défaut .env : passerelle du réseau Docker du projet (HAProxy sur l'hôte).
      internal-proxies: ${TRUSTED_PROXIES}
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto

spring:
  ssl:
    bundle:
      pem:
        api:
          reload-on-update: true
          keystore:
            certificate: file:${TLS_CERT_FILE:/run/secrets/tls/tls.crt}
            private-key: file:${TLS_KEY_FILE:/run/secrets/tls/tls.key}
          options:
            enabled-protocols: TLSv1.3
            ciphers: TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,TLS_AES_128_GCM_SHA256

management:
  # Actuator sur un port séparé, lié à la boucle locale du conteneur : seul le healthcheck Docker y accède.
  server:
    port: 8081
    address: 127.0.0.1
    ssl:
      enabled: false   # boucle locale du conteneur uniquement
  endpoints:
    access:
      default: none
  endpoint:
    health:
      access: read-only
    info:
      access: read-only

app:
  # Pas de connecteur HTTP de redirection : HAProxy redirige 80 → 443. Définir HTTP_REDIRECT_PORT uniquement si
  # l'API est exposée sans reverse proxy.
  server:
    http-redirect-port: ${HTTP_REDIRECT_PORT:}
  security:
    strict: true
    require-https: true
    https-port: ${PUBLIC_HTTPS_PORT:443}
    redirect-host: ${PUBLIC_HOST:}
    hsts:
      enabled: true
      max-age: 730d
      include-sub-domains: true
      preload: true
    content-security-policy: "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests"
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
      allow-credentials: false

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
