# PRODUCTION — ./start.sh --prod  (docker compose -f docker-compose.prod.yml …)
# Exposition publique par HAProxy + WAF sur le serveur (docs/ops/DEPLOIEMENT-PROD.md) ; l'API n'est publiée que sur
# la boucle locale. Test local de toute la chaîne : docker-compose.test-prod.yml (./start.sh --test-prod).
name: formation-prod

services:
  db:
    build: docker/db                 # postgres:18.7-alpine épinglé, sans gosu, utilisateur postgres (docker/db/Dockerfile)
    image: formation-db:18.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # PostgreSQL 18 : PGDATA = /var/lib/postgresql/18/docker → on monte le dossier parent.
      - pgdata:/var/lib/postgresql
      - ./init_db:/init_db:ro
    # Pas de port publié : administration via « docker compose -f docker-compose.prod.yml exec db psql … »
    # Durcissement : utilisateur postgres (image), système de fichiers en lecture seule hors données et sockets.
    read_only: true
    tmpfs:
      - /var/run/postgresql:uid=70,gid=70,mode=0775,size=8m
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- OpenBao (ADR 0001)
  # Serveur Raft + TLS interne, scellé à chaque démarrage (descellement Shamir manuel), jamais publié.
  openbao-prod:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    restart: unless-stopped
    command: ["bao", "server", "-config=/openbao/config/openbao.hcl"]
    environment:
      BAO_ADDR: https://127.0.0.1:8200
      BAO_CACERT: /openbao/tls/ca.crt
    networks:
      default:
        aliases: [openbao]
    volumes:
      # OPENBAO_CONFIG_PATH : uniquement pour la procédure break-glass (admin-token.sh), sinon openbao.hcl.
      - ${OPENBAO_CONFIG_PATH:-./docker/prod/openbao/openbao.hcl}:/openbao/config/openbao.hcl:ro
      - ./docker/openbao:/scripts:ro
      - ${OPENBAO_TLS_DIR:-./secrets/openbao-tls}:/openbao/tls:ro
      - openbao-data:/openbao/file
      - openbao-audit:/openbao/logs
    group_add:
      - "${TLS_CERT_GID:-1000}"       # lecture de la clé TLS interne (0640)
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 256
    healthcheck:
      # Code 0 = descellé ; 2 = scellé (→ unhealthy : ./start.sh --prod guide le descellement).
      test: ["CMD", "bao", "status"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------- API
  api-prod:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    image: formation-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      openbao-prod:
        condition: service_healthy   # descellé (sinon l'API refuserait de démarrer)
    environment:
      # Connexion DB : hôte et base seulement — identifiants dynamiques (OpenBao, ADR 0001).
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS requis en prod}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      PUBLIC_HTTPS_PORT: ${PUBLIC_HTTPS_PORT:-443}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?TRUSTED_PROXIES requis en prod}
    volumes:
      # Dossier alimenté par le deploy hook certbot (docker/prod/certbot/deploy-hook.sh), rechargé à chaud.
      # On monte le DOSSIER (pas les fichiers) pour que les remplacements atomiques soient vus.
      - ${TLS_CERT_DIR:-./certs}:/run/secrets/tls:ro
      # Identifiants AppRole (role-id, secret-id ; 0440) et CA interne d'OpenBao — jamais la clé de la CA.
      - ${OPENBAO_CREDS_DIR:-./secrets/openbao-creds}:/run/secrets/openbao:ro
      - ${OPENBAO_TLS_DIR:-./secrets/openbao-tls}/ca.crt:/run/secrets/openbao-ca.crt:ro
      # Fichiers téléversés, chiffrés au repos (clés de données dans OpenBao) : à sauvegarder AVEC la base.
      - uploads:/var/lib/formation/uploads
    ports:
      # Publié pour le reverse proxy uniquement (boucle locale par défaut) : jamais exposé directement sur Internet.
      - "${API_BIND:-127.0.0.1}:${API_HTTPS_PORT:-8443}:8443"
    # Durcissement du conteneur
    user: "10001:10001"
    group_add:
      - "${TLS_CERT_GID:-1000}"       # lecture de la clé TLS (mode 0640, groupe dédié)
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 512

# Sous-réseau fixe : la passerelle (x.x.x.1) est l'IP sous laquelle un reverse proxy installé sur l'hôte atteint
# l'API (TRUSTED_PROXIES) et le réseau autorisé de l'AppRole api (BOUND_CIDRS).
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.31.0.0/24}

volumes:
  pgdata:
  openbao-data:
  openbao-audit:
  uploads:
