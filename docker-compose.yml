# Profils : dev | prod | test  →  docker compose --profile <profil> ...  (ou ./start.sh)
name: ${COMPOSE_PROJECT_NAME:-formation}

x-db-env: &db-env
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # PostgreSQL 18 : PGDATA = /var/lib/postgresql/18/docker → on monte le dossier parent.
      - pgdata:/var/lib/postgresql
      - ./init_db:/init_db:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - ./:/app
      - m2cache:/m2
    ports:
      - "${API_PORT:-8080}:8080"
      - "127.0.0.1:${DEBUG_PORT:-5005}:5005"

  api-prod:
    profiles: [prod]
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-formation}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS requis en prod}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      PUBLIC_HTTPS_PORT: ${PUBLIC_HTTPS_PORT:-443}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?TRUSTED_PROXIES requis en prod}
    volumes:
      # Dossier alimenté par le deploy hook certbot (docker/prod/certbot/deploy-hook.sh), rechargé à chaud.
      # On monte le DOSSIER (pas les fichiers) pour que les remplacements atomiques soient vus.
      - ${TLS_CERT_DIR:-./certs}:/run/secrets/tls:ro
    ports:
      # Publié pour HAProxy uniquement (boucle locale par défaut) : jamais exposé directement sur Internet.
      - "${API_BIND:-127.0.0.1}:${API_HTTPS_PORT:-8443}:8443"
    # Durcissement du conteneur
    user: "10001:10001"
    group_add:
      - "${TLS_CERT_GID:-1000}"       # lecture de la clé TLS (mode 0640, groupe dédié)
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 512

  api-test:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/test/Dockerfile
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - m2cache-test:/root/.m2
      - ./target/test-reports:/reports

# Sous-réseau fixe : la passerelle (x.x.x.1) est l'IP sous laquelle HAProxy, sur l'hôte, atteint l'API.
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.0.0/24}

volumes:
  pgdata:
  m2cache:
  m2cache-test:
