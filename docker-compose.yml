# DÉVELOPPEMENT — ./start.sh (ou docker compose up -d)
#   Prod           : docker-compose.prod.yml
#   Test de la prod: docker-compose.prod.yml + docker-compose.test-prod.yml (./start.sh --test-prod)
#   Tests          : docker compose --profile test run --rm api-test (./start.sh --test)
name: formation

services:
  db:
    build: docker/db                 # postgres:18.7-alpine épinglé, sans gosu, utilisateur postgres (docker/db/Dockerfile)
    image: formation-db:18.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # PostgreSQL 18 : PGDATA = /var/lib/postgresql/18/docker → on monte le dossier parent.
      - pgdata:/var/lib/postgresql
      - ./init_db:/init_db:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- OpenBao (ADR 0001)
  # Mode dev (en mémoire, descellé, recréé à chaque démarrage), configuré par openbao-init depuis .env.dev.
  openbao-dev:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    command: ["server", "-dev", "-dev-no-store-token", "-config=/openbao/config/dev.hcl"]
    env_file:
      - path: .env.dev
        required: true
    environment:
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    volumes:
      - ./docker/openbao/dev.hcl:/openbao/config/dev.hcl:ro
    networks:
      default:
        aliases: [openbao]
    ports:
      - "127.0.0.1:${OPENBAO_DEV_PORT:-8200}:8200"   # confort dev (CLI / UI locale)
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Rôles PostgreSQL du modèle de droits (idempotent, à chaque démarrage ; en prod via bootstrap.sh).
  db-roles:
    build: docker/db
    image: formation-db:18.7
    entrypoint: ["sh", "/scripts/roles.sh"]
    env_file:
      - path: .env.dev
        required: true
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
    volumes:
      - ./docker/db/roles.sh:/scripts/roles.sh:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Configuration d'OpenBao dev avec le MÊME script que la prod, alimenté par .env.dev.
  openbao-init:
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    entrypoint: ["sh", "/scripts/configure.sh"]
    user: "0"   # écrit les identifiants AppRole dans le volume partagé (dev uniquement)
    env_file:
      - path: .env.dev
        required: true
    environment:
      BAO_ADDR: http://openbao:8200
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      BOUND_CIDRS: 172.30.0.0/24
      DB_CONFIG_MODE: always
      CREDS_OUT_DIR: /creds
      CREDS_MODE: "0444"
    volumes:
      - ./docker/openbao:/scripts:ro
      - openbao-dev-creds:/creds
    depends_on:
      openbao-dev:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
    restart: "no"

  # ---------------------------------------------------------------- API
  api-dev:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    depends_on:
      db:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      OPENBAO_ADDR: http://openbao:8200
    volumes:
      - ./:/app
      - m2cache:/m2
      - openbao-dev-creds:/run/secrets/openbao:ro
    ports:
      - "${API_PORT:-8080}:8080"
      - "127.0.0.1:${DEBUG_PORT:-5005}:5005"

  # ---------------------------------------------------------------- Tests (profil test, à la demande)
  api-test:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/test/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Non-root ; accès au socket Docker (Testcontainers) via son groupe propriétaire, calculé par ./start.sh --test et
    # run-tests.sh. Défaut 65534 (nogroup) : sans DOCKER_GID, aucun accès au socket (échec explicite des tests).
    group_add:
      - "${DOCKER_GID:-65534}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - m2cache-tester:/m2
      - ./target/test-reports:/reports

# Sous-réseau fixe (lié à l'AppRole dev : BOUND_CIDRS) ; distinct de la prod (172.31.0.0/24) → les deux peuvent
# tourner en même temps sur un poste.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  m2cache:
  m2cache-tester:
  openbao-dev-creds:
