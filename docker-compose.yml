# Profils : dev | prod | test  →  docker compose --profile <profil> ...  (ou ./start.sh)
name: ${COMPOSE_PROJECT_NAME:-formation}

# Connexion DB de l'API : hôte et base seulement — les identifiants sont dynamiques (OpenBao, ADR 0001).
x-db-env: &db-env
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${DB_NAME}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # PostgreSQL 18 : PGDATA = /var/lib/postgresql/18/docker → on monte le dossier parent.
      - pgdata:/var/lib/postgresql
      - ./init_db:/init_db:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- OpenBao (ADR 0001)
  # Dev : mode dev (en mémoire, descellé, recréé à chaque démarrage), configuré par openbao-init depuis .env.dev.
  openbao-dev:
    profiles: [dev]
    image: openbao/openbao:2.7.2
    command: ["server", "-dev", "-dev-no-store-token", "-config=/openbao/config/dev.hcl"]
    env_file:
      - path: .env.dev
        required: true
    environment:
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    volumes:
      - ./docker/openbao/dev.hcl:/openbao/config/dev.hcl:ro
    networks:
      default:
        aliases: [openbao]
    ports:
      - "127.0.0.1:${OPENBAO_DEV_PORT:-8200}:8200"   # confort dev (CLI / UI locale)
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Rôles PostgreSQL du modèle de droits (idempotent, à chaque démarrage dev ; en prod via bootstrap.sh).
  db-roles:
    profiles: [dev]
    image: postgres:18-alpine
    entrypoint: ["sh", "/scripts/roles.sh"]
    env_file:
      - path: .env.dev
        required: true
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
    volumes:
      - ./docker/db/roles.sh:/scripts/roles.sh:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Configuration d'OpenBao dev avec le MÊME script que la prod, alimenté par .env.dev.
  openbao-init:
    profiles: [dev]
    image: openbao/openbao:2.7.2
    entrypoint: ["sh", "/scripts/configure.sh"]
    user: "0"   # écrit les identifiants AppRole dans le volume partagé (dev uniquement)
    env_file:
      - path: .env.dev
        required: true
    environment:
      BAO_ADDR: http://openbao:8200
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      BOUND_CIDRS: ${DOCKER_SUBNET:-172.30.0.0/24}
      DB_CONFIG_MODE: always
      CREDS_OUT_DIR: /creds
      CREDS_MODE: "0444"
    volumes:
      - ./docker/openbao:/scripts:ro
      - openbao-dev-creds:/creds
    depends_on:
      openbao-dev:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
    restart: "no"

  # Prod : serveur Raft + TLS interne, scellé à chaque démarrage (descellement Shamir manuel), jamais publié.
  openbao-prod:
    profiles: [prod]
    image: openbao/openbao:2.7.2
    restart: unless-stopped
    command: ["bao", "server", "-config=/openbao/config/openbao.hcl"]
    environment:
      BAO_ADDR: https://127.0.0.1:8200
      BAO_CACERT: /openbao/tls/ca.crt
    networks:
      default:
        aliases: [openbao]
    volumes:
      # OPENBAO_CONFIG_PATH : uniquement pour la procédure break-glass (admin-token.sh), sinon openbao.hcl.
      - ${OPENBAO_CONFIG_PATH:-./docker/prod/openbao/openbao.hcl}:/openbao/config/openbao.hcl:ro
      - ./docker/openbao:/scripts:ro
      - ${OPENBAO_TLS_DIR:-./secrets/openbao-tls}:/openbao/tls:ro
      - openbao-data:/openbao/file
      - openbao-audit:/openbao/logs
    group_add:
      - "${TLS_CERT_GID:-1000}"       # lecture de la clé TLS interne (0640)
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 256
    healthcheck:
      # Code 0 = descellé ; 2 = scellé (→ unhealthy : ./start.sh --prod guide le descellement).
      test: ["CMD", "bao", "status"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  api-dev:
    profiles: [dev]
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    depends_on:
      db:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      OPENBAO_ADDR: http://openbao:8200
    volumes:
      - ./:/app
      - m2cache:/m2
      - openbao-dev-creds:/run/secrets/openbao:ro
    ports:
      - "${API_PORT:-8080}:8080"
      - "127.0.0.1:${DEBUG_PORT:-5005}:5005"

  api-prod:
    profiles: [prod]
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-formation}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      openbao-prod:
        condition: service_healthy   # descellé (sinon l'API refuserait de démarrer)
    environment:
      <<: *db-env
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS requis en prod}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      PUBLIC_HTTPS_PORT: ${PUBLIC_HTTPS_PORT:-443}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?TRUSTED_PROXIES requis en prod}
    volumes:
      # Dossier alimenté par le deploy hook certbot (docker/prod/certbot/deploy-hook.sh), rechargé à chaud.
      # On monte le DOSSIER (pas les fichiers) pour que les remplacements atomiques soient vus.
      - ${TLS_CERT_DIR:-./certs}:/run/secrets/tls:ro
      # Identifiants AppRole (role-id, secret-id ; 0440) et CA interne d'OpenBao — jamais la clé de la CA.
      - ${OPENBAO_CREDS_DIR:-./secrets/openbao-creds}:/run/secrets/openbao:ro
      - ${OPENBAO_TLS_DIR:-./secrets/openbao-tls}/ca.crt:/run/secrets/openbao-ca.crt:ro
    ports:
      # Publié pour HAProxy uniquement (boucle locale par défaut) : jamais exposé directement sur Internet.
      - "${API_BIND:-127.0.0.1}:${API_HTTPS_PORT:-8443}:8443"
    # Durcissement du conteneur
    user: "10001:10001"
    group_add:
      - "${TLS_CERT_GID:-1000}"       # lecture de la clé TLS (mode 0640, groupe dédié)
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 512

  api-test:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/test/Dockerfile
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - m2cache-test:/root/.m2
      - ./target/test-reports:/reports

# Sous-réseau fixe : la passerelle (x.x.x.1) est l'IP sous laquelle HAProxy, sur l'hôte, atteint l'API.
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.0.0/24}

volumes:
  pgdata:
  m2cache:
  m2cache-test:
  openbao-dev-creds:
  openbao-data:
  openbao-audit:
