# HAProxy (>= 2.8, testé avec 3.2) — exposition publique HTTPS de l'API.
# À installer sur le serveur : /etc/haproxy/haproxy.cfg (adapter les presetenv ci-dessous ou les fournir par
# l'environnement du service systemd).
#
#   Internet ──80──▶ redirection 301 HTTPS (sauf challenge ACME → certbot sur 127.0.0.1:8888)
#   Internet ──443 (TLS 1.3, Let's Encrypt)──▶ HAProxy ──TLS 1.3 re-chiffré, certificat vérifié──▶ API 127.0.0.1:8443

global
    log /dev/log local0
    maxconn 4096
    # Valeurs par défaut, surchargées par l'environnement si présent.
    presetenv API_DOMAIN       api.example.be
    presetenv API_BACKEND      127.0.0.1:8443
    presetenv API_CA_FILE      @system-ca
    presetenv CERTBOT_BACKEND  127.0.0.1:8888
    presetenv HTTP_BIND        :80
    presetenv HTTPS_BIND       :443
    presetenv CERT_DIR         /etc/haproxy/certs/

    # TLS côté clients : TLS 1.3 uniquement, suites AEAD, courbes modernes, pas de tickets de session.
    ssl-default-bind-options ssl-min-ver TLSv1.3 no-tls-tickets
    ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
    ssl-default-bind-curves X25519:P-256:P-384
    # TLS vers l'API : mêmes exigences.
    ssl-default-server-options ssl-min-ver TLSv1.3 no-tls-tickets
    ssl-default-server-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s        # anti slowloris
    timeout http-keep-alive 5s
    timeout queue 10s

# ---------------------------------------------------------------------------- HTTP (80)
frontend http_in
    bind "${HTTP_BIND}"
    acl acme_challenge path_beg /.well-known/acme-challenge/
    http-request redirect scheme https code 301 unless acme_challenge
    use_backend certbot if acme_challenge

# ---------------------------------------------------------------------------- HTTPS (443)
frontend https_in
    bind "${HTTPS_BIND}" ssl crt "${CERT_DIR}" alpn h2,http/1.1

    # Seul le nom de l'API est servi (pas de Host arbitraire, pas d'accès par IP).
    acl valid_host req.hdr(host),field(1,:) -i "${API_DOMAIN}"
    http-request deny deny_status 421 unless valid_host

    # Limitation de débit par IP : 100 requêtes / 10 s, 50 connexions simultanées.
    stick-table type ipv6 size 200k expire 10m store http_req_rate(10s),conn_cur
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
    http-request deny deny_status 429 if { sc_conn_cur(0) gt 50 }

    # En-têtes de proxy : on ne fait JAMAIS confiance à ceux envoyés par le client.
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-Port
    http-request del-header X-Real-IP
    option forwardfor
    http-request set-header X-Forwarded-Proto https

    # HSTS aussi sur les réponses générées par HAProxy (421, 429, 503…) ; l'API pose le sien.
    http-after-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" if !{ res.hdr(Strict-Transport-Security) -m found }

    default_backend api

# ---------------------------------------------------------------------------- Backends
backend api
    # Re-chiffrement vers l'API avec vérification du certificat (même certificat Let's Encrypt que le frontal).
    server api1 "${API_BACKEND}" ssl verify required ca-file "${API_CA_FILE}" sni str("${API_DOMAIN}") verifyhost "${API_DOMAIN}" alpn h2,http/1.1 check check-ssl check-sni "${API_DOMAIN}" inter 5s fall 3 rise 2

backend certbot
    # certbot renew --standalone --http-01-address 127.0.0.1 --http-01-port 8888 (n'écoute que pendant un renouvellement)
    server certbot "${CERTBOT_BACKEND}"
