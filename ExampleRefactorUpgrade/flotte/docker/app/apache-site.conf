# Site unique : front controller Symfony (FallbackResource), + /__health (santé du conteneur, hors application).
<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    <Directory ${APACHE_DOCUMENT_ROOT}>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex ${APP_FRONT_CONTROLLER}
        FallbackResource /${APP_FRONT_CONTROLLER}
    </Directory>

    Alias /__health /opt/flotte/health.php
    <Directory /opt/flotte>
        Require all granted
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
