; Configuration PHP commune à toutes les étapes (docker/app/<famille>/Dockerfile) — environnement de dev local.
; Toute modification change potentiellement le comportement observé : à faire valider (bug pour bug).
date.timezone = Europe/Brussels
precision = 14
serialize_precision = -1
memory_limit = 512M
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log

; Journal des dépréciations + couverture PCOV à la demande (ne modifient pas le comportement)
auto_prepend_file = /opt/flotte/prepend.php

; PCOV : activé par variable d'environnement (PCOV_ENABLED=1 pour app, 0 pour app-ref)
pcov.enabled = ${PCOV_ENABLED}
pcov.directory = /srv/app
pcov.exclude = "~/(vendor|tests|var|app/cache|\.claude|\.ref)/~"
