<h1>Nouveau véhicule</h1>
<form name="vehicle" method="post"><div id="vehicle"><div><label for="vehicle_plate" class="required">Plaque</label><ul><li>La plaque &quot;1-AB-123&quot; n&#039;est pas une plaque belge valide (format 1-ABC-123).</li></ul><input type="text" id="vehicle_plate" name="vehicle[plate]" required="required" value="1-AB-123" /></div><div><label for="vehicle_brand" class="required">Marque</label><input type="text" id="vehicle_brand" name="vehicle[brand]" required="required" value="Renault" /></div><div><label for="vehicle_model" class="required">Modèle</label><input type="text" id="vehicle_model" name="vehicle[model]" required="required" value="Master" /></div><div><label for="vehicle_mileage" class="required">Kilométrage</label><input type="number" id="vehicle_mileage" name="vehicle[mileage]" required="required" value="1500" /></div><div><label for="vehicle_status" class="required">Statut</label><select id="vehicle_status" name="vehicle[status]"><option value="0" selected="selected">Disponible</option><option value="1">En entretien</option><option value="2">Hors service</option></select></div><input type="hidden" id="vehicle__token" name="vehicle[_token]" value="__CSRF__" /></div></form>
</body>
</html>
