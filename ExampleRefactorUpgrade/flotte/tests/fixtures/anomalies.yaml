# Scénario « anomalies » — généré une fois puis maintenu à la main : ce fichier est la source de vérité.
# Chargé par tests/bin/seed.php (PDO direct) ; base figée : fixtures/db/anomalies.sqlite (+ .sha256).
# Dates naïves 'Y-m-d H:i:s' (heure de Bruxelles, comme l'application) ; coût = km × 0,35 au centime.
scenario: anomalies
description: |
  Données INCOHÉRENTES qu'une base legacy peut contenir (saisies directes, imports, bugs passés) : statuts inconnus,
  valeurs négatives ou vides, coût NULL ou non numérique, fin avant début, statut mal orthographié. Isolées ici pour ne
  pas casser les autres scénarios : ce sont les cas où PHP 7 et PHP 8 divergent le plus (notices devenues warnings ou
  TypeError, null vers fonctions internes). Le comportement step-00 (y compris une erreur 500) est le comportement attendu.
